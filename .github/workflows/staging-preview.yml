name: Staging Preview Lifecycle

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: vars.STAGING_PREVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, staging-vps]
    defaults:
      run:
        working-directory: preview-tooling
    timeout-minutes: 30
    concurrency:
      group: staging-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      STAGING_PREVIEW_BASE_DIR: ${{ secrets.STAGING_BASE_DIR }}
      STAGING_PREVIEW_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
      STAGING_PREVIEW_DISABLE_HOSTS_UPDATE: "true"
      STAGING_PREVIEW_CADDY_MANAGED_TLS: "false"
      STAGING_PREVIEW_CERT_PATH: ${{ secrets.CERT_PATH }}
      STAGING_PREVIEW_CERT_KEY_PATH: ${{ secrets.CERT_KEY_PATH }}
      STAGING_PREVIEW_CADDY_CERT_PATH: ${{ secrets.CADDY_CERT_PATH }}
      STAGING_PREVIEW_CADDY_CERT_KEY_PATH: ${{ secrets.CADDY_CERT_KEY_PATH }}
      STAGING_PREVIEW_DB_DUMPS: ${{ vars.STAGING_PREVIEW_DB_DUMPS }}
      TIMEZONE: ${{ vars.TIMEZONE || 'UTC' }}

    steps:
      - name: Checkout preview tooling
        uses: actions/checkout@v4
        with:
          repository: jecis-repos/staging-preview
          ref: main
          path: preview-tooling
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP server dependencies
        run: npm --prefix mcp-server ci

      - name: Build MCP server
        run: npm --prefix mcp-server run build

      - name: Derive preview metadata
        id: meta
        run: node scripts/ci/derive-preview-meta.mjs

      - name: Provision preview
        if: steps.meta.outputs.preview_mode == 'provision'
        env:
          PREVIEW_MODE: provision
          INSTANCE_NAME: ${{ steps.meta.outputs.instance_name }}
          BRANCH_NAME: ${{ steps.meta.outputs.branch_name }}
          DB_SEED: ${{ steps.meta.outputs.db_seed }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
        run: node scripts/ci/preview-lifecycle.mjs

      - name: Destroy preview
        if: steps.meta.outputs.preview_mode == 'destroy'
        env:
          PREVIEW_MODE: destroy
          INSTANCE_NAME: ${{ steps.meta.outputs.instance_name }}
        run: node scripts/ci/preview-lifecycle.mjs

      - name: Publish summary
        if: steps.meta.outputs.preview_mode != 'skip'
        env:
          PREVIEW_MODE: ${{ steps.meta.outputs.preview_mode }}
          INSTANCE_NAME: ${{ steps.meta.outputs.instance_name }}
          BRANCH_NAME: ${{ steps.meta.outputs.branch_name }}
          DB_SEED: ${{ steps.meta.outputs.db_seed }}
          PREVIEW_HOST: ${{ steps.meta.outputs.preview_host }}
        run: |
          {
            printf '### Staging Preview\n'
            printf -- '- Mode: `%s`\n- Instance: `%s`\n- Branch: `%s`\n- DB seed: `%s`\n- Host: https://%s\n' "$PREVIEW_MODE" "$INSTANCE_NAME" "$BRANCH_NAME" "$DB_SEED" "$PREVIEW_HOST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish skip summary
        if: steps.meta.outputs.preview_mode == 'skip'
        run: echo 'Preview skipped because the skip-staging label is present.' >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR with preview URL
        if: steps.meta.outputs.preview_mode == 'provision' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INSTANCE_NAME: ${{ steps.meta.outputs.instance_name }}
          BRANCH_NAME: ${{ steps.meta.outputs.branch_name }}
          DB_SEED: ${{ steps.meta.outputs.db_seed }}
          PREVIEW_HOST: ${{ steps.meta.outputs.preview_host }}
        run: |
          {
            printf '### Staging Preview Ready\n\n'
            printf '**Instance:** `%s`\n**URL:** https://%s\n**Branch:** `%s`\n**DB seed:** `%s`\n\n' "$INSTANCE_NAME" "$PREVIEW_HOST" "$BRANCH_NAME" "$DB_SEED"
            printf 'Preview will be destroyed when this PR is closed or merged.\n'
          } > "$RUNNER_TEMP/preview-comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/preview-comment.md"

      - name: Comment on failure
        if: failure() && steps.meta.outputs.preview_mode != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_MODE: ${{ steps.meta.outputs.preview_mode }}
          INSTANCE_NAME: ${{ steps.meta.outputs.instance_name }}
          BRANCH_NAME: ${{ steps.meta.outputs.branch_name }}
        run: |
          {
            printf '### Staging Preview Failed\n\n'
            printf '**Mode:** `%s`\n**Instance:** `%s`\n**Branch:** `%s`\n\n' "$PREVIEW_MODE" "$INSTANCE_NAME" "$BRANCH_NAME"
            printf '[View workflow run](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/preview-comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/preview-comment.md"
