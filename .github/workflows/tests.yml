name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix mcp-server ci
      - run: npm run build
      - run: npm test
      - run: for script in scripts/ops/*.sh; do bash -n "$script"; done
